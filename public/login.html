<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - ClassQU</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="auth-bg"><section class="auth-card">
<div class="auth-brand">ClassQU</div><p class="auth-tagline">Smart University Attendance Monitor</p><h1>Welcome back</h1>
<form id="form"><label class="form-label" for="email">Email</label><input class="form-input" id="email" type="email" autocomplete="username" required>
<label class="form-label" for="password">Password</label><input class="form-input" id="password" type="password" autocomplete="current-password" required>
<div id="error" class="form-error hidden" role="alert"></div><button id="submit" type="submit" style="width:100%;margin-top:18px">Login</button></form>
<p class="auth-foot"><a href="/register">Create an account</a> · <a href="/forgot">Forgot password?</a></p>
</section></main><footer class="site-footer"><div class="footer-inner"><div class="footer-bottom"><span>© <span data-year>2026</span> ClassQU — Track. Alert. Stay Updated.</span><span><a href="/contact">Contact</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></span></div></div></footer><script>
const form=document.getElementById('form'), error=document.getElementById('error');
form.addEventListener('submit',async e=>{e.preventDefault();error.classList.add('hidden');const button=document.getElementById('submit');button.disabled=true;
const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();
if(!r.ok){error.textContent=d.error||'Login failed.';error.classList.remove('hidden');button.disabled=false;return}location.replace(d.redirect||'/dashboard');});
</script></body></html>
